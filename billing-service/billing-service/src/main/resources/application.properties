spring.application.name=billing-service

# ─────────── Server ───────────
server.port=8087
# ─────────── MySQL ───────────
spring.datasource.url=jdbc:mysql://localhost:3306/billing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Kartikesh@6773
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────── JPA ───────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─────────── Eureka ───────────
eureka.client.service-url.defaultZone=http://localhost:8762/eureka/

# ─────────── Feign ───────────
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

# ─────────── Logging ───────────
logging.level.com.example.billing_service=DEBUG