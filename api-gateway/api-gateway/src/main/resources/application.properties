# ─────────── Server ───────────
spring.application.name=api-gateway
server.port=8083

# ─────────── Eureka Client ───────────
eureka.client.service-url.defaultZone=http://localhost:8762/eureka/

# ─────────── Eureka Discovery Locator ───────────
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ─────────── CORS ───────────
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# ─────────── Auth Service Route ───────────
spring.cloud.gateway.routes[0].id=auth-service-route
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# ─────────── Vehicle Service Route ───────────
spring.cloud.gateway.routes[1].id=vehicle-service-route
spring.cloud.gateway.routes[1].uri=lb://VEHICLE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/vehicles/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# ─────────── Mechanic Service Route ───────────
spring.cloud.gateway.routes[2].id=mechanic-service-route
spring.cloud.gateway.routes[2].uri=lb://MECHANIC-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/mechanics/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# ─────────── Appointment Service Route ───────────
spring.cloud.gateway.routes[3].id=appointment-service-route
spring.cloud.gateway.routes[3].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/appointments/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

# ─────────── Spare Part Service Route ───────────
spring.cloud.gateway.routes[4].id=sparepart-service-route
spring.cloud.gateway.routes[4].uri=lb://SPARE-PARTS-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/parts/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

# ─────────── Billing Service Route ───────────
spring.cloud.gateway.routes[5].id=billing-service-route
spring.cloud.gateway.routes[5].uri=lb://BILLING-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1

# ─────────── Actuator (⚠️ फक्त Gateway मध्ये!) ───────────
management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true

# ─────────── JWT ───────────
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# ─────────── Logging ───────────
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.smartvehicle.apigateway=DEBUG